<title>カジュアル面談マニュアル｜株式会社MoreVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#f2f6fb; --paper:#ffffff; --fg:#0a1128; --muted:#565f7a; --line:#dbe3f0;
  --accent:#005fc0; --accent-soft:#e4ecf6; --navy:#0a1f44;
  --me:#e4ecf6; --them:#f1f3f7; --good:#2b6b3f; --good-bg:#e2f1e6; --warn:#a1332b;
  --hot:#c62828; --hot-bg:#fff5f4; --marker:#ffe066;
  --display:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --paper:#16202c; --fg:#e3e9f1; --muted:#9aa7b8; --line:#2a3646;
  --accent:#7db6f0; --accent-soft:#1d2b3c; --navy:#0b1422;
  --me:#1d2b3c; --them:#1f2732; --good:#86d29d; --good-bg:#183022; --warn:#f2948a; --hot:#ff8a80; --hot-bg:#2e1a1a; --marker:#6b5a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --paper:#16202c; --fg:#e3e9f1; --muted:#9aa7b8; --line:#2a3646;
  --accent:#7db6f0; --accent-soft:#1d2b3c; --navy:#0b1422;
  --me:#1d2b3c; --them:#1f2732; --good:#86d29d; --good-bg:#183022; --warn:#f2948a; --hot:#ff8a80; --hot-bg:#2e1a1a; --marker:#6b5a12; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
.sheet{max-width:760px;margin:0 auto;padding:28px 16px 48px}
@media(min-width:720px){.sheet{padding:44px 32px 64px}}
a{color:var(--accent)}
p{margin:0 0 10px}
.nb{display:inline-block}
.small{font-size:13.5px;color:var(--muted)}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:26px 20px 20px;margin-bottom:8px}
@media(min-width:720px){.hero{padding:36px 34px 26px}}
.eyebrow{font-size:12.5px;letter-spacing:.1em;opacity:.8;margin:0 0 8px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(25px,6vw,36px);line-height:1.35;margin:0 0 12px;text-wrap:balance}
.def{background:rgba(255,255,255,.1);border-left:3px solid rgba(255,255,255,.6);border-radius:0 8px 8px 0;padding:8px 12px;font-size:14px;line-height:1.7;margin:0 0 12px}
.def b{display:block;font-size:12.5px;letter-spacing:.06em;opacity:.85}
.lead{opacity:.92}
.lead{margin:0}
.toc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:16px}
@media(min-width:720px){.toc{padding:22px 32px}}
.toc-h{font-family:var(--display);font-weight:700;font-size:16px;margin:0 0 2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.toc{counter-reset:t}
.toc ol{list-style:none;margin:0;padding:0}
.toc-g{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.toc-g b{font-size:12.5px;color:var(--fg);letter-spacing:.1em}
.toc .must{background:var(--accent-soft);border-radius:8px;border-bottom:0;margin:2px -10px}
.toc .must a{font-weight:700;padding-left:10px;padding-right:10px}
.toc-badge{display:inline-block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--paper);background:var(--accent);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.toc li{counter-increment:t;border-bottom:1px dashed var(--line)}
.toc li:last-child{border-bottom:0}
.toc a{display:flex;gap:12px;align-items:baseline;padding:9px 2px;text-decoration:none;color:var(--fg);font-size:15px;line-height:1.5}
.toc a::before{content:counter(t);flex:none;font-family:var(--display);font-weight:900;color:var(--accent);min-width:1.2em}
.toc a:hover{color:var(--accent)}
section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:16px}
@media(min-width:720px){section{padding:30px 32px}}
h2{font-family:var(--display);font-size:clamp(20px,4.6vw,24px);line-height:1.4;margin:0 0 12px;display:flex;gap:10px;align-items:center;text-wrap:balance}
h2 .no{font-size:14px;font-weight:900;color:#fff;background:var(--accent);border-radius:999px;width:1.9em;height:1.9em;display:inline-grid;place-items:center;flex:none}
h3{font-family:var(--display);font-size:17px;margin:22px 0 8px}
strong{color:var(--accent)}
.two{display:grid;gap:10px;margin:12px 0 14px}
@media(min-width:620px){.two{grid-template-columns:1fr 1fr}}
.card{background:var(--accent-soft);border-radius:10px;padding:14px 16px}
.card p{margin:0}
.card-h{font-weight:700;margin-bottom:4px!important}
/* skill map */
.map{display:grid;gap:8px;margin:14px 0 6px}
.map-row{display:grid;gap:8px;grid-template-columns:1fr}
.map-head{display:none}
.skill{font-family:var(--display);font-weight:900;font-size:17px;color:var(--accent);padding-top:6px}
.cell{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.6;background:var(--paper);transition:background .2s,border-color .2s}
.cell em{font-style:normal;font-weight:700;color:var(--accent);margin-right:6px;font-size:13px}
.cell.done{background:var(--good-bg);border-color:transparent}
.cell.next{border:2px solid var(--accent);background:var(--accent-soft)}
@media(min-width:680px){
  .map-row{grid-template-columns:88px repeat(3,1fr);align-items:stretch}
  .map-head{display:grid;font-weight:700;font-size:14px;color:var(--muted);text-align:center}
  .skill{padding-top:10px}
  .cell em{display:none}
}
.steps{margin:6px 0 10px;padding-left:1.4em}
.steps li{margin-bottom:6px}
.note{font-weight:700;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
/* opening */
.flow{list-style:none;counter-reset:f;margin:12px 0 0;padding:0}
.flow>li{counter-increment:f;position:relative;padding:0 0 16px 40px;border-left:2px solid var(--line);margin-left:14px}
.flow>li:last-child{border-left-color:transparent;padding-bottom:0}
.flow>li::before{content:counter(f);position:absolute;left:-15px;top:0;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.flow-h{font-weight:700;margin-bottom:4px}
.say{background:var(--me);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;font-weight:500}
/* star cards */
.star{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.star-h{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.5;display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.lv{flex:none;font-size:13px;font-weight:900;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.star ul{margin:0 0 10px;padding-left:1.2em}
.talk{display:grid;gap:6px;margin:10px 0}
.talk p{margin:0;max-width:88%;padding:8px 13px;border-radius:14px;font-size:15px;line-height:1.6}
.talk .them{background:var(--them);justify-self:start;border-bottom-left-radius:4px}
.talk .them::before{content:"相手";display:block;font-size:11px;color:var(--muted)}
.talk .me{background:var(--me);justify-self:end;border-bottom-right-radius:4px}
.talk .me::before{content:"あなた";display:block;font-size:11px;color:var(--accent)}
.check{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:flex-start;font-size:14px;font-weight:700;color:var(--good);background:var(--good-bg);border-radius:8px;padding:8px 12px;margin:10px 0 0}
.check::before{content:"できたかの目安";flex:none;font-size:11.5px;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-top:2px;font-weight:700}
.qs{display:grid;gap:10px;margin:8px 0}
@media(min-width:620px){.qs{grid-template-columns:1fr 1fr}}
.qs>div{background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.qs-h{font-weight:700;font-size:14px;margin:0 0 2px;color:var(--accent)}
.qs ul{margin:0;padding-left:1.1em;font-size:14.5px}
.chips{list-style:none;padding:0!important;display:flex;flex-wrap:wrap;gap:6px}
.chips li{border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-size:14px}
.chips span{font-size:11.5px;color:var(--muted);margin-left:6px}
.prep{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.prep li{display:grid;grid-template-columns:32px 4.2em 1fr;align-items:center;gap:8px;background:var(--accent-soft);border-radius:8px;padding:7px 10px;font-size:15px}
.prep b{font-family:var(--display);font-size:18px;color:var(--accent);text-align:center}
.prep span{font-size:12.5px;color:var(--muted)}
.signs{display:grid;gap:8px;margin:10px 0}
.signs>div{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px}
.signs>div::before{content:"→";order:2;color:var(--accent);font-weight:700;text-align:center}
.sign{margin:0;color:var(--muted);order:1}
.fix{margin:0;font-weight:700;order:3}
.timeline{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.timeline li{display:grid;grid-template-columns:5.6em 1fr;gap:10px;border-bottom:1px dashed var(--line);padding:6px 0;font-size:15px}
.timeline .t{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.help{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.help li{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:15px}
.help b{display:block;font-size:13px;color:var(--muted)}
.mail{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:6px 0 14px;background:var(--me)}
.mail p{margin:0 0 10px}
.copy{font:inherit;font-size:14px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:6px 14px;cursor:pointer;min-height:36px}
.review{margin:6px 0 0;padding-left:1.2em}
.unused-prep-box{border:2px solid var(--accent);border-radius:12px;padding:16px 18px;margin:12px 0 4px}
.prep-box-h{font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);margin:0 0 6px}
.prep-box-sub{font-weight:700;margin:12px 0 6px}
.q3{margin:0 0 8px;padding:0;list-style:none;counter-reset:q;display:grid;gap:6px}
.q3 li{counter-increment:q;background:var(--me);border-radius:8px;padding:8px 12px 8px 40px;position:relative;font-weight:500}
.q3 li::before{content:"Q" counter(q);position:absolute;left:10px;top:8px;font-weight:900;color:var(--accent);font-size:14px}
.alert{font-family:var(--display);font-weight:900;font-size:clamp(20px,4.8vw,26px);line-height:1.55;color:var(--hot);border:2px solid var(--hot);background:var(--hot-bg);border-radius:12px;padding:16px 18px;margin:4px 0 14px;text-wrap:balance}
.alert mark{color:var(--hot);background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 2px}
.plus{margin:10px 0 0;font-size:14.5px;border-top:1px dashed var(--line);padding-top:10px}
.plus b{color:var(--accent);margin-right:8px;font-family:var(--display)}
.help-chips{list-style:none;padding:0;margin:8px 0 4px;display:flex;flex-wrap:wrap;gap:8px}
.help-chips li{background:var(--me);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500}
.help-chips li::before{content:"「"}
.help-chips li::after{content:"」"}
.st+.note,.help-box+.note{margin-top:16px}
.st{position:relative;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;margin-top:14px}
@media(min-width:720px){.st{padding:18px 20px 16px}}
.st-h{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.45;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.st-no{flex:none;width:1.9em;height:1.9em;border-radius:50%;border:2px solid var(--accent);background:var(--paper);color:var(--accent);font-family:var(--display);font-weight:900;font-size:15px;display:inline-grid;place-items:center}
.phase{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin:22px 0 -4px;display:flex;align-items:center;gap:10px}
.phase::after{content:"";flex:1;height:1px;background:var(--line)}
.st-sub{font-weight:700;font-size:14px;color:var(--muted);margin:10px 0 6px}
.st .say{margin-bottom:8px}
.branch{display:grid;gap:10px}
@media(min-width:680px){.branch{grid-template-columns:1fr 1fr}}
.br{background:var(--bg);border-radius:10px;padding:12px 14px}
.br p{margin:0 0 8px}
.br p:last-child{margin-bottom:0}
.br-h{font-weight:700;color:var(--accent)}
.tip{margin:10px 0 0;font-size:14.5px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.tip b{display:block}
.dots{margin:0;padding-left:1.2em}
.dots li{margin-bottom:4px}
.st .mail{margin:0}
.help-box{margin-top:14px;border-radius:12px;background:var(--hot-bg);border:1px dashed var(--hot);padding:14px 16px}
.help-h{font-family:var(--display);font-weight:700;color:var(--hot);margin:0 0 4px}
.help-box .help-chips li{background:var(--paper)}
.basis{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.basis li{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.basis b{display:block}
.foot{font-size:12.5px;color:var(--muted);margin-top:20px;line-height:1.7}
/* lock */
.lock{max-width:420px;margin:12vh auto 0;padding:0 16px}
.lock-box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.lock h1{color:var(--accent);font-size:24px}
.lock label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
.lock input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.lock button{margin-top:12px;width:100%;font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px;cursor:pointer}
.lock .err{color:var(--warn);font-size:14px;min-height:1.6em;margin:8px 0 0}
@media print{.toc,.copy{display:none}body{background:#fff}section{break-inside:avoid-page}}
</style>
</head>
<body>
<div class="lock" id="lock">
<div class="lock-box">
<p class="small" style="margin:0 0 4px">株式会社MoreVision · 学生向けガイド</p>
<h1>カジュアル面談マニュアル</h1>
<p class="small">このページはパスワードで保護されています。案内で受け取ったパスワードを入れてください。</p>
<form id="lockForm">
<label for="pw">パスワード</label>
<input id="pw" type="password" inputmode="numeric" autocomplete="current-password" required>
<button type="submit">開く</button>
<p class="err" id="err" aria-live="polite"></p>
</form>
</div>
</div>
<main class="sheet" id="app" hidden></main>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function unlock(pw){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(DATA.salt),iterations:DATA.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(DATA.iv)},key,b64(DATA.ct));
  return new TextDecoder().decode(buf);
}
async function tryOpen(pw,quiet){
  try{
    var html=await unlock(pw);
    var app=document.getElementById('app');
    app.innerHTML=html; app.hidden=false;
    document.getElementById('lock').remove();
    try{sessionStorage.setItem('cm-pw',pw)}catch(e){}
    init();
    if(location.hash){var t=document.querySelector(location.hash);if(t)t.scrollIntoView();}
  }catch(e){
    if(!quiet)document.getElementById('err').textContent='パスワードが違います。もう一度入れてください。';
  }
}
document.getElementById('lockForm').addEventListener('submit',function(e){e.preventDefault();tryOpen(document.getElementById('pw').value,false)});
try{var saved=sessionStorage.getItem('cm-pw');if(saved)tryOpen(saved,true)}catch(e){}

function init(){
  document.querySelectorAll('.copy').forEach(function(btn){
    btn.addEventListener('click',function(){
      var t=document.getElementById(btn.dataset.target).textContent;
      (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){btn.textContent='コピーしました'},function(){btn.textContent='長押しでコピーしてください'});
      setTimeout(function(){btn.textContent='文面をコピー'},2000);
    });
  });
}
</script>
